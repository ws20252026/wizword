<!DOCTYPE html>

<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>WizWord Test</title>
  <style>
    body{background:#0d1117;color:#f0c040;font-family:monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    .box{text-align:center;padding:40px}
    h1{font-size:2rem;margin-bottom:16px}
    p{color:#8b949e;font-size:.9rem}
    button{background:#7c3aed;border:none;color:white;padding:12px 24px;border-radius:10px;font-size:1rem;cursor:pointer;margin-top:20px}
  </style>
</head>
<body>
  <div class="box">
    <h1>⚡ WizWord</h1>
    <p id="msg">測試中...</p>
    <button onclick="test()">點我測試</button>
  </div>
  <script>
    document.getElementById('msg').textContent = 'JavaScript 正常運作！localStorage 可用：' + (typeof localStorage !== 'undefined' ? '✅' : '❌');
    function test() {
      localStorage.setItem('test', Date.now());
      alert('儲存成功！值：' + localStorage.getItem('test'));
    }
  </script>
</body>
</html>
