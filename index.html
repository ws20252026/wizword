<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="WizWord"/>
<meta name="theme-color" content="#0d1117"/>
<title>WizWord ⚡</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d1117'/><text y='.9em' font-size='72' x='14'>⚡</text></svg>"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0d1117;color:#e6edf3;font-family:Georgia,serif}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}

/* Screens */
.screen{display:none;min-height:100vh;background:#0d1117}
.screen.active{display:block}

/* Nav */
.nav{max-width:700px;margin:0 auto;padding:16px 16px 0;display:flex;align-items:center;gap:8px}
.logo{font-size:1.15rem;font-weight:900;color:#f0c040;letter-spacing:.05em}
.logo-sub{font-size:.5rem;color:#8b949e;letter-spacing:.08em;text-transform:uppercase}
.nav-btns{margin-left:auto;display:flex;gap:4px}
.nav-btn{background:none;border:1px solid #30363d;border-radius:20px;padding:4px 11px;font-family:monospace;font-size:.62rem;cursor:pointer;color:#8b949e;transition:all .18s}
.nav-btn.on{background:#f0c040;border-color:#f0c040;color:#0d1117;font-weight:600}

/* XP bar */
.xp-bar{max-width:700px;margin:0 auto;padding:8px 16px 0;display:flex;align-items:center;gap:8px}
.xp-track{flex:1;height:5px;background:#21262d;border-radius:3px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#f0c040);border-radius:3px;transition:width .5s}
.badge{font-family:monospace;font-size:.6rem;padding:2px 8px;border-radius:20px;background:#21262d;border:1px solid #30363d;color:#f0c040;font-weight:600;white-space:nowrap}
.xp-lbl{font-family:monospace;font-size:.56rem;color:#8b949e;white-space:nowrap}

/* Main content area */
.main{max-width:700px;margin:0 auto;padding:18px 16px 60px}

/* Cards */
.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:20px;margin-bottom:12px}
.card-purple{background:linear-gradient(135deg,#1c1033,#0d1117);border-color:#3d2e6b}

/* Buttons */
.btn{border:none;border-radius:12px;padding:12px 16px;font-family:Georgia,serif;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .18s;display:block;text-align:center;width:100%;margin-bottom:8px}
.btn-purple{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:white;box-shadow:0 4px 18px rgba(124,58,237,.3)}
.btn-purple:hover{transform:translateY(-2px)}
.btn-purple:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-gold{background:linear-gradient(135deg,#f0c040,#c9903a);color:#0d1117}
.btn-gold:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:#161b22;border:1px solid #30363d;color:#c8d0da;font-family:monospace;font-size:.72rem}
.btn-red{background:#2a0d0d;border:1.5px solid #ef4444;color:#ef4444}
.btn-green{background:#0d2a0d;border:1.5px solid #22c55e;color:#22c55e}
.btn-orange{background:#1a1208;border:1.5px solid #c9903a55;color:#c9903a}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1;margin-bottom:0}

/* Typography */
.word-big{font-family:Georgia,serif;font-size:2.6rem;font-weight:900;color:#f0c040;letter-spacing:.02em;line-height:1;margin-bottom:6px}
.phonetic{font-family:monospace;font-size:.78rem;color:#8b949e;margin-bottom:3px}
.pos{font-family:monospace;font-size:.64rem;color:#c9903a;letter-spacing:.07em;margin-bottom:12px}
.meaning{font-family:Georgia,serif;font-size:1.7rem;font-weight:700;color:#f0c040;margin-bottom:8px}
.example{font-family:Georgia,serif;font-style:italic;font-size:.9rem;color:#a0aab4;line-height:1.72}
.example b{color:#f0c040;font-style:normal}
.extrans{font-family:Georgia,serif;font-size:.78rem;color:#6a7a8a;line-height:1.6;padding-left:8px;border-left:2px solid #2a3545;margin-top:8px}
.tag-hs{display:inline-block;font-family:monospace;font-size:.56rem;padding:2px 8px;border-radius:20px;background:#1a2a1a;border:1px solid #22c55e44;color:#22c55e;margin-bottom:12px}
.tag-toefl{display:inline-block;font-family:monospace;font-size:.56rem;padding:2px 8px;border-radius:20px;background:#1a1a2e;border:1px solid #7c3aed44;color:#a78bfa;margin-bottom:12px}
.divider{height:1px;background:#21262d;margin:14px 0}
.section-label{font-family:monospace;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:#7c3aed;margin-bottom:8px}
.muted{color:#8b949e;font-family:monospace;font-size:.64rem}
.gold{color:#f0c040}
.green{color:#22c55e}
.red{color:#ef4444}
.purple{color:#a78bfa}

/* Stat boxes */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat-box{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;text-align:center}
.stat-val{font-family:Georgia,serif;font-size:1.5rem;font-weight:700;color:#f0c040}
.stat-lbl{font-family:monospace;font-size:.54rem;color:#8b949e;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

/* Daily dots */
.daily-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.daily-dot{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;font-size:.68rem;padding:5px;gap:2px;border:1.5px solid #30363d;background:#161b22;color:#8b949e}
.daily-dot.done{border-color:#22c55e44;background:#0d2a0d;color:#22c55e}
.daily-dot.pending{border-color:#c9903a77;background:#1a1208;color:#f0c040}
.daily-dot-word{font-size:.4rem;opacity:.7;word-break:break-all;text-align:center}

/* Flash card */
.flash-card{background:#161b22;border:1px solid #30363d;border-radius:20px;padding:24px;margin-bottom:12px;position:relative}
.flash-card-back{background:linear-gradient(160deg,#1c1033,#0f0a1e);border-color:#3d2e6b;text-align:center;padding:32px 24px}
.card-hint{font-family:monospace;font-size:.56rem;color:#2a3545;text-align:right;margin-top:12px}
.speak-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.speak-btn{background:none;border:1.5px solid #30363d;border-radius:20px;padding:5px 12px;font-family:monospace;font-size:.6rem;cursor:pointer;color:#8b949e;transition:all .18s;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.speak-btn:hover{border-color:#f0c040;color:#f0c040}

/* Progress dots (cards) */
.prog-dots{display:flex;gap:5px;align-items:center}
.prog-dot{width:7px;height:7px;border-radius:50%;background:#30363d;transition:all .25s}
.prog-dot.seen{background:#22c55e;box-shadow:0 0 4px #22c55e66}
.prog-dot.current{background:#f0c040;box-shadow:0 0 6px #f0c04099}

/* Progress bar */
.prog-bar{height:3px;background:#21262d;border-radius:2px;margin-bottom:14px;overflow:hidden}
.prog-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#22c55e,#f0c040);transition:width .4s}

/* Phase header */
.phase-hdr{display:flex;align-items:center;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.back-btn{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:5px 11px;font-family:monospace;font-size:.64rem;cursor:pointer;color:#8b949e}
.back-btn:hover{border-color:#f0c040;color:#f0c040}
.ptag{font-family:monospace;font-size:.6rem;padding:3px 8px;border-radius:4px}
.ptag-purple{background:#1a1a2e;border:1px solid #7c3aed44;color:#a78bfa}
.ptag-green{background:#1a2a1a;border:1px solid #22c55e44;color:#22c55e}
.ptag-red{background:#1a0808;border:1px solid #ef444444;color:#ef4444}
.combo{font-family:monospace;font-size:.66rem;font-weight:600;padding:3px 8px;border-radius:20px;background:#1a1a2e;border:1px solid #7c3aed55;color:#a78bfa}
.prog-lbl{margin-left:auto;font-family:monospace;font-size:.66rem;color:#8b949e}

/* Spell input */
.letter-boxes{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.lbox{width:30px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:.9rem;font-weight:700;border:1.5px solid #30363d;background:#21262d;color:#e6edf3;transition:all .2s}
.lbox.filled{border-color:#7c3aed;color:#a78bfa;background:#1a1a2e}
.lbox.correct{border-color:#22c55e;color:#22c55e;background:#0d2a0d}
.lbox.wrong{border-color:#ef4444;color:#ef4444;background:#2a0d0d}
.spell-input{width:100%;background:#21262d;border:2px solid #30363d;border-radius:12px;padding:13px 15px;font-family:Georgia,serif;font-size:1.15rem;color:#e6edf3;text-align:center;letter-spacing:.08em;outline:none;transition:border-color .2s}
.spell-input:focus{border-color:#7c3aed}
.spell-input.correct{border-color:#22c55e;background:#0d2a0d}
.spell-input.wrong{border-color:#ef4444;background:#2a0d0d}
.result-msg{margin-top:10px;font-family:monospace;font-size:.8rem;line-height:1.6;text-align:center}

/* Streak */
.streak-card{border-radius:16px;padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.streak-num{font-family:Georgia,serif;font-size:2.2rem;font-weight:900;color:#f0c040;line-height:1}
.streak-sub{font-family:Georgia,serif;font-size:.82rem;color:#c9903a;margin-top:3px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}
.week-day-lbl{font-family:monospace;font-size:.54rem;text-align:center;color:#4a5568;margin-bottom:4px}
.week-day-lbl.today{color:#f0c040;font-weight:700}
.week-circle{width:32px;height:32px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;border:2px solid #21262d;background:#161b22;color:#21262d}
.week-circle.checked{background:linear-gradient(135deg,#c9903a,#f0c040);border-color:transparent;color:#0d1117;box-shadow:0 2px 10px rgba(240,192,64,.35)}
.week-circle.today-empty{border:2px dashed #c9903a55;color:#3d4a5a}

/* Novel */
.novel-card{background:#0e1219;border:1px solid #21262d;border-radius:14px;padding:16px;margin-bottom:10px}
.novel-card.unlocked{background:linear-gradient(135deg,#1c1033,#0f0a1e);border-color:#3d2e6b}
.novel-emoji{font-size:1.8rem;opacity:.3}
.novel-emoji.unlocked{opacity:1}
.novel-title{font-family:Georgia,serif;font-size:.9rem;font-weight:700;color:#3d4a5a}
.novel-title.unlocked{color:#f0c040}
.novel-sub{font-family:monospace;font-size:.54rem;color:#2a3545}
.novel-sub.unlocked{color:#7c3aed}
.btn-sm-purple{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:white;border:none;border-radius:8px;padding:6px 14px;font-family:Georgia,serif;font-size:.76rem;font-weight:700;cursor:pointer;white-space:nowrap}

/* Ebbinghaus pills */
.ebbi-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.ebbi-pill{font-family:monospace;font-size:.56rem;padding:2px 6px;border-radius:3px;background:#21262d;border:1px solid #30363d;color:#8b949e}
.ebbi-pill.first{background:#7c3aed22;border-color:#7c3aed44;color:#a78bfa}

/* Filter */
.filter-row{display:flex;gap:5px;margin-bottom:12px}
.filt{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:5px 11px;font-family:monospace;font-size:.66rem;cursor:pointer;color:#8b949e;transition:all .15s}
.filt.on{background:#7c3aed;border-color:#7c3aed;color:white}

/* Done screen */
.done-card{background:#161b22;border:1px solid #30363d;border-radius:20px;padding:36px 26px;text-align:center}
.done-stars{font-size:2.2rem;letter-spacing:4px;margin-bottom:12px}
.done-title{font-family:Georgia,serif;font-size:1.6rem;font-weight:900;color:#f0c040;margin-bottom:6px}
.done-xp{font-family:monospace;font-size:2rem;font-weight:700;color:#7c3aed;margin-bottom:2px}
.done-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:18px}
.done-stat{background:#21262d;border-radius:9px;padding:11px}
.done-stat-val{font-family:Georgia,serif;font-size:1.4rem;font-weight:700;margin-bottom:2px}
.done-stat-lbl{font-family:monospace;font-size:.52rem;color:#8b949e;text-transform:uppercase}

/* Unlock banner */
.unlock-banner{background:linear-gradient(135deg,#1c1033,#0f0a1e);border:2px solid #7c3aed;border-radius:20px;padding:28px;text-align:center;margin-bottom:14px;box-shadow:0 0 40px rgba(124,58,237,.4)}

/* Scramble */
.token-bank{display:flex;flex-wrap:wrap;gap:7px;background:#161b22;border-radius:14px;padding:14px;border:1px solid #30363d;margin-bottom:10px}
.token{background:linear-gradient(135deg,#1a2a1a,#0f1e0f);border:1.5px solid #22c55e55;border-radius:8px;padding:7px 13px;font-family:Georgia,serif;font-size:.9rem;color:#c8d0da;cursor:pointer;user-select:none;transition:all .2s}
.token.used{background:#21262d;border-color:#21262d;color:#2a3545;text-decoration:line-through;opacity:.4;cursor:default}
.answer-tray{background:#0d1117;border:2px solid #21262d;border-radius:14px;padding:14px;min-height:64px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;margin-bottom:10px;position:relative;transition:border-color .3s}
.answer-tray.correct{border-color:#22c55e}
.answer-tray.wrong{border-color:#ef4444}
.answer-tray-hint{font-family:monospace;font-size:.6rem;color:#2a3545;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap}
.placed-token{background:linear-gradient(135deg,#1a1a2e,#12112a);border:1.5px solid #7c3aed66;border-radius:8px;padding:6px 12px;font-family:Georgia,serif;font-size:.88rem;color:#c8d0da;cursor:pointer;user-select:none;transition:all .15s}
.placed-token.correct{background:#0d2a0d;border-color:#22c55e;color:#22c55e}
.placed-token.wrong{background:#2a0d0d;border-color:#ef4444;color:#ef4444}

/* Spell 5-dot progress */
.spell-prog{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.spell-prog-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;border:2px solid #21262d;background:#161b22;color:#2a3545;transition:all .3s}
.spell-prog-dot.done{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:transparent;color:#fff;box-shadow:0 0 8px #22c55e66}
.spell-prog-dot.current{border-color:#7c3aed;color:#a78bfa;background:#1a1a2e}

/* Stats chart */
.lv-chart{display:flex;gap:5px;align-items:flex-end;height:68px;margin-bottom:24px}
.lv-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.lv-bar{width:100%;border-radius:3px 3px 0 0;transition:height .5s;background:#21262d}
.lv-bar.has{background:linear-gradient(to top,#7c3aed,#f0c040)}
.lv-lbl{font-family:monospace;font-size:.48rem;color:#8b949e}

@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){.btn{padding:10px 13px;font-size:.8rem}}
</style>

</head>
<body>

<!-- SCREENS -->

<div id="s-home" class="screen active">
  <div class="nav">
    <div><div class="logo">⚡ WizWord</div><div class="logo-sub">Ebbinghaus · Harry Potter</div></div>
    <div class="nav-btns">
      <button class="nav-btn on" onclick="showScreen('home')">首頁</button>
      <button class="nav-btn" onclick="showScreen('library')">📚</button>
      <button class="nav-btn" onclick="showScreen('stats')">統計</button>
    </div>
  </div>
  <div id="xp-bar-home" class="xp-bar"></div>
  <div class="main" id="home-main"></div>
</div>

<div id="s-cards" class="screen">
  <div class="nav">
    <div><div class="logo">⚡ WizWord</div></div>
    <div class="nav-btns"><button class="nav-btn" onclick="showScreen('home')">首頁</button></div>
  </div>
  <div class="main" id="cards-main"></div>
</div>

<div id="s-spell" class="screen">
  <div class="nav">
    <div><div class="logo">⚡ WizWord</div></div>
    <div class="nav-btns"><button class="nav-btn" onclick="showScreen('home')">首頁</button></div>
  </div>
  <div class="main" id="spell-main"></div>
</div>

<div id="s-review" class="screen">
  <div class="nav">
    <div><div class="logo">⚡ WizWord</div></div>
    <div class="nav-btns"><button class="nav-btn" onclick="showScreen('home')">首頁</button></div>
  </div>
  <div class="main" id="review-main"></div>
</div>

<div id="s-wrongreview" class="screen">
  <div class="nav">
    <div><div class="logo">⚡ WizWord</div></div>
    <div class="nav-btns"><button class="nav-btn" onclick="showScreen('home')">首頁</button></div>
  </div>
  <div class="main" id="wrongreview-main"></div>
</div>

<div id="s-scramble" class="screen">
  <div class="nav">
    <div><div class="logo">⚡ WizWord</div></div>
    <div class="nav-btns"><button class="nav-btn" onclick="showScreen('home')">首頁</button></div>
  </div>
  <div class="main" id="scramble-main"></div>
</div>

<div id="s-done" class="screen">
  <div class="nav">
    <div><div class="logo">⚡ WizWord</div></div>
    <div class="nav-btns"><button class="nav-btn" onclick="showScreen('home')">首頁</button></div>
  </div>
  <div class="main" id="done-main"></div>
</div>

<div id="s-library" class="screen">
  <div class="nav">
    <div><div class="logo">⚡ WizWord</div></div>
    <div class="nav-btns">
      <button class="nav-btn" onclick="showScreen('home')">首頁</button>
      <button class="nav-btn on">📚</button>
      <button class="nav-btn" onclick="showScreen('stats')">統計</button>
    </div>
  </div>
  <div class="main" id="library-main"></div>
</div>

<div id="s-novel" class="screen">
  <div class="nav">
    <div><div class="logo">⚡ WizWord</div></div>
    <div class="nav-btns"><button class="nav-btn" onclick="showScreen('library')">← 書庫</button></div>
  </div>
  <div class="main" id="novel-main"></div>
</div>

<div id="s-stats" class="screen">
  <div class="nav">
    <div><div class="logo">⚡ WizWord</div></div>
    <div class="nav-btns">
      <button class="nav-btn" onclick="showScreen('home')">首頁</button>
      <button class="nav-btn on">統計</button>
    </div>
  </div>
  <div class="main" id="stats-main"></div>
</div>

<script>
// 1. 基礎畫面切換邏輯
function showScreen(screenName) {
  // 隱藏所有畫面
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  // 顯示目標畫面
  const target = document.getElementById('s-' + screenName);
  if (target) target.classList.add('active');

  // 更新導覽列按鈕狀態
  document.querySelectorAll('.nav-btn').forEach(btn => {
    if (btn.innerText === '首頁' && screenName === 'home') btn.classList.add('on');
    else if (btn.innerText === '📚' && screenName === 'library') btn.classList.add('on');
    else if (btn.innerText === '統計' && screenName === 'stats') btn.classList.add('on');
    else btn.classList.remove('on');
  });
}

// 2. 初始化範例內容（填補原本為空的 id="...-main" 區塊）
function initApp() {
  // 填補首頁內容
  document.getElementById('home-main').innerHTML = `
    <div class="card card-purple">
      <div class="word-big">Expecto Patronum</div>
      <div class="phonetic">/ɛkˈspɛktoʊ pəˈtroʊnəm/</div>
      <div class="pos">SPELL</div>
      <div class="meaning">呼神護衛</div>
      <div class="example">Harry conjured a powerful stag Patronus to drive away the Dementors.</div>
    </div>
    <button class="btn btn-purple" onclick="showScreen('cards')">開始翻卡複習</button>
    <button class="btn btn-gold" onclick="showScreen('spell')">拼字挑戰</button>
  `;

  // 填補經驗值條
  document.getElementById('xp-bar-home').innerHTML = `
    <div class="badge">LV 12</div>
    <div class="xp-track"><div class="xp-fill" style="width: 65%;"></div></div>
    <div class="xp-lbl">325 / 500 XP</div>
  `;

  // 填補卡片複習畫面
  document.getElementById('cards-main').innerHTML = `
    <div class="phase-hdr">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <span class="ptag ptag-purple">卡片模式</span>
